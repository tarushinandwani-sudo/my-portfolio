<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Player | Tarushi Nandwani</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>

    <style>
        :root { --deep-bg: #050505; --purple: #6a5acd; --hot-pink: #d63384; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--deep-bg); color: white; overflow-x: hidden; }

        .nav-back { position: fixed; top: 30px; left: 30px; z-index: 1000; text-decoration: none; color: white; font-size: 0.8rem; letter-spacing: 2px; }

        /* THE VINYL PLAYER */
        .player-zone {
            height: 50vh; display: flex; align-items: center; justify-content: center;
            flex-direction: column; padding-top: 50px;
        }
        .turntable {
            width: 250px; height: 250px; background: #111; border-radius: 50%;
            border: 8px solid #222; position: relative; display: flex; align-items: center; justify-content: center;
        }
        .needle {
            position: absolute; top: -10px; right: -30px; width: 100px; height: 8px;
            background: #444; transform-origin: left; transform: rotate(45deg); transition: 0.5s; z-index: 10;
        }

        /* THE CRATE */
        .crate { display: flex; overflow-x: auto; padding: 40px; gap: 30px; justify-content: center; }
        .vinyl-item { text-align: center; cursor: pointer; transition: 0.3s; width: 160px; }
        .vinyl-item:hover { transform: translateY(-10px); }
        .record {
            width: 150px; height: 150px; border-radius: 50%;
            background: radial-gradient(circle, #222 0%, #000 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 1px solid #333;
        }
        .label { width: 55px; height: 55px; border-radius: 50%; border: 1px solid #111; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); z-index: 2000; }
        .scrapbook-container { display: flex; flex-wrap: wrap; justify-content: center; padding: 80px 20px; gap: 30px; }
        
        .polaroid {
            background: white; padding: 15px 15px 40px 15px; width: 220px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); transform: rotate(-2deg); color: #333;
        }
        .polaroid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; margin-bottom: 15px; }
        .polaroid p { font-family: 'Caveat', cursive; font-size: 1.2rem; text-align: center; }

        .close-btn { position: fixed; top: 30px; right: 30px; font-size: 2.5rem; cursor: pointer; color: white; z-index: 3000; }
        #globeViz { width: 100%; height: 100vh; }
        .music-bar { position: fixed; bottom: 20px; right: 20px; width: 300px; border-radius: 12px; overflow: hidden; z-index: 1500; }
    </style>
</head>
<body>

    <a href="index.html" class="nav-back">← LIBRARY</a>

    <div class="player-zone">
        <div class="turntable">
            <div class="needle" id="needle"></div>
            <div id="playing-record" class="record" style="width: 220px; height: 220px; display:none;">
                <div class="label" id="playing-label"></div>
            </div>
        </div>
        <h2 id="now-playing" style="font-family:'Playfair Display'; margin-top:20px;">Pick a Vinyl</h2>
    </div>

    <div class="crate">
        <div class="vinyl-item" onclick="playRecord('The Person', '#ffb6c1', 'scrapbook')">
            <div class="record"><div class="label" style="background:#ffb6c1;"></div></div>
            <p>The Person</p>
        </div>
        <div class="vinyl-item" onclick="playRecord('World Tour', '#6a5acd', 'globe')">
            <div class="record"><div class="label" style="background:#6a5acd;"></div></div>
            <p>World Tour</p>
        </div>
        <div class="vinyl-item" onclick="window.location.href='about.html'">
            <div class="record"><div class="label" style="background:#444;"></div></div>
            <p>University Life</p>
        </div>
    </div>

    <div id="scrapbookModal" class="modal">
        <span class="close-btn" onclick="closeModal('scrapbookModal')">×</span>
        <div class="scrapbook-container">
            <div class="polaroid"><img src="me2.jpg"><p>Hi! My name is Tarushi, but I go by Tara too!</p></div>
            <div class="polaroid" style="transform:rotate(3deg)"><img src="unsw.jpg"><p>My second home @ UNSW.</p></div>
            <div class="polaroid" style="transform:rotate(-4deg)"><img src="matcha.jpg"><p>Fueled by Matcha & Croissants!</p></div>
        </div>
    </div>

    <div id="worldTourModal" class="modal">
        <span class="close-btn" onclick="closeModal('worldTourModal')">×</span>
        <div id="globeViz"></div>
    </div>

    <div class="music-bar">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/6sGIMrtIzQjdzNndVxe397?utm_source=generator" width="100%" height="80" frameBorder="0" allow="autoplay; encrypted-media;"></iframe>
    </div>

    <script>
        function playRecord(name, color, type) {
            document.getElementById('needle').style.transform = 'rotate(15deg)';
            document.getElementById('playing-record').style.display = 'flex';
            document.getElementById('playing-label').style.background = color;
            document.getElementById('now-playing').innerText = "Playing: " + name;

            setTimeout(() => {
                if(type === 'scrapbook') openModal('scrapbookModal');
                if(type === 'globe') openModal('worldTourModal');
            }, 1000);
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'block'; 
            if(id === 'worldTourModal') setTimeout(initGlobe, 100);
        }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            document.getElementById('needle').style.transform = 'rotate(45deg)';
        }

        function initGlobe() {
            const places = [
                { lat: 20.59, lng: 78.96, name: 'India', desc: 'Childhood roots!' },
                { lat: 24.45, lng: 54.37, name: 'UAE', desc: 'Born here!' },
                { lat: -33.86, lng: 151.20, name: 'Sydney', desc: 'Current Base!' }
            ];
            const world = Globe()(document.getElementById('globeViz'))
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                .backgroundColor('rgba(0,0,0,0)')
                .pointsData(places)
                .pointColor(() => '#6a5acd')
                .pointLabel(d => `<div style="background:#111; padding:10px;"><b>${d.name}</b><br>${d.desc}</div>`)
                .autoRotate(true).autoRotateSpeed(1.2)(document.getElementById('globeViz'));
            const mat = world.globeMaterial();
            mat.color = new THREE.Color('#1a1a2e');
            mat.emissive = new THREE.Color('#483d8b');
            mat.emissiveIntensity = 0.2;
        }
    </script>
</body>
</html>
