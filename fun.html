<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discography | Tarushi Nandwani</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>

    <style>
        :root { --hot-pink: #d63384; --soft-pink: #ffdee5; --glass: rgba(255, 255, 255, 0.2); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Poppins', sans-serif; background: #000; color: white; overflow: hidden; }

        /* Navigation */
        .nav-back { position: fixed; top: 20px; left: 20px; z-index: 1000; color: white; text-decoration: none; font-weight: 600; font-size: 0.9rem; letter-spacing: 2px; }

        /* The Turntable Section */
        #player-zone {
            height: 60vh; width: 100%; display: flex; align-items: center; justify-content: center;
            position: relative; transition: 1s ease;
        }

        .turntable {
            width: 300px; height: 300px; background: #222; border-radius: 50%;
            border: 10px solid #333; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .needle {
            position: absolute; top: -20px; right: -40px; width: 120px; height: 10px;
            background: #666; transform-origin: left; transform: rotate(45deg);
            transition: 0.5s; z-index: 10;
        }

        /* The Records in the Crate */
        #crate {
            height: 40vh; width: 100%; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); display: flex; align-items: center; 
            justify-content: center; gap: 30px; padding: 20px; box-sizing: border-box;
        }

        .vinyl {
            width: 180px; height: 180px; background: radial-gradient(circle, #333 0%, #000 100%);
            border-radius: 50%; cursor: pointer; position: relative;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .vinyl:hover { transform: translateY(-20px); }
        .vinyl::after { content: ''; width: 60px; height: 60px; border-radius: 50%; background: var(--hot-pink); border: 2px solid #111; }
        
        .label-text { position: absolute; bottom: -30px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--soft-pink); }

        /* Globe Section (Hidden initially) */
        #globe-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #4b0082, #000);
            display: none; opacity: 0; z-index: 500;
        }

        /* Spotify Widget */
        #music-box { position: fixed; bottom: 20px; right: 20px; width: 300px; z-index: 2000; opacity: 0; transform: translateY(20px); transition: 0.5s; }

        /* Tooltip */
        #location-tag {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%);
            background: var(--hot-pink); padding: 5px 15px; border-radius: 20px;
            font-weight: 600; display: none; z-index: 2001; pointer-events: none;
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> LIBRARY</a>
    <div id="location-tag">Sydney: I'm Here!</div>

    <div id="player-zone">
        <div class="turntable">
            <div class="needle" id="needle"></div>
            </div>
        <h2 id="era-title" style="position: absolute; bottom: 20px; font-family: 'Playfair Display'; font-size: 2.5rem;">Pick an Era</h2>
    </div>

    <div id="crate">
        <div class="vinyl" onclick="playEra('Anthology', 'freshman')"><span class="label-text">The Anthology</span></div>
        <div class="vinyl" onclick="playEra('Midnights', 'sophomore')"><span class="label-text">Midnights</span></div>
        <div class="vinyl" onclick="playEra('Visions', 'junior')"><span class="label-text">Visions</span></div>
        <div class="vinyl" onclick="playEra('World Tour', 'globe')"><span class="label-text">World Tour</span></div>
    </div>

    <div id="globe-section">
        <div id="globeViz"></div>
        <button onclick="stopEra()" style="position:fixed; top:20px; right:20px; background:none; border:1px solid white; color:white; padding:10px 20px; border-radius:50px; cursor:pointer; z-index:1000;">CLOSE ERA</button>
    </div>

    <div id="music-box">
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/6sGIMrtIzQjdzNndVxe397?utm_source=generator" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <script>
        let globe;

        function playEra(name, type) {
            // 1. Animation: Needle moves
            gsap.to("#needle", { rotation: 15, duration: 0.5 });
            document.getElementById('era-title').innerText = name;

            // 2. Music fades in
            gsap.to("#music-box", { opacity: 1, y: 0, duration: 1 });

            // 3. If Globe, morph to 3D section
            if (type === 'globe') {
                document.getElementById('globe-section').style.display = 'block';
                gsap.to("#globe-section", { opacity: 1, duration: 1.5, onComplete: initGlobe });
            }
        }

        function stopEra() {
            gsap.to("#globe-section", { opacity: 0, duration: 0.5, onComplete: () => {
                document.getElementById('globe-section').style.display = 'none';
                gsap.to("#needle", { rotation: 45, duration: 0.5 });
            }});
        }

        function initGlobe() {
            const places = [
                { lat: 20.59, lng: 78.96, name: 'India' },
                { lat: 24.45, lng: 54.37, name: 'UAE' },
                { lat: 22.31, lng: 114.16, name: 'Hong Kong' },
                { lat: -33.86, lng: 151.20, name: 'Sydney' }
            ];

            globe = Globe()
                (document.getElementById('globeViz'))
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                .backgroundColor('rgba(0,0,0,0)')
                .pointsData(places)
                .pointColor(() => '#d63384')
                .pointRadius(0.5)
                .pointLabel('name')
                .onPointHover((point) => {
                    const tag = document.getElementById('location-tag');
                    if (point && point.name === 'Sydney') {
                        tag.style.display = 'block';
                    } else {
                        tag.style.display = 'none';
                    }
                })
                .autoRotate(true)
                .autoRotateSpeed(1.5)
                (document.getElementById('globeViz'));

            // Set the Dark Pink Aesthetic
            const globeMaterial = globe.globeMaterial();
            globeMaterial.color = new THREE.Color('#3b0d24'); // Deepest Pink-Black
            globeMaterial.emissive = new THREE.Color('#d63384');
            globeMaterial.emissiveIntensity = 0.1;

            // Highlight Sydney specifically
            globe.pointAltitude(d => d.name === 'Sydney' ? 0.1 : 0.02);
        }
    </script>
</body>
</html>
