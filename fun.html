<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discography | Tarushi Nandwani</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="//unpkg.com/globe.gl"></script> <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #ffdee5 100%);
            --apple-pink: #ffb6c1;
            --hot-pink: #d63384;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient); color: #1a1a1a;
            overflow-x: hidden; text-align: center;
        }

        /* Nav */
        .nav-back { position: absolute; top: 30px; left: 30px; text-decoration: none; color: var(--hot-pink); font-weight: 600; z-index: 100; }

        header { padding: 100px 20px 40px; }
        header h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin: 0; color: var(--hot-pink); }
        
        /* Vinyl Section */
        .vinyl-crate {
            display: flex; justify-content: center; gap: 50px;
            padding: 40px; flex-wrap: wrap;
        }

        .album-container { width: 200px; cursor: pointer; perspective: 1000px; }
        .sleeve {
            width: 200px; height: 200px; background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 4px; overflow: hidden; position: relative; z-index: 2;
        }
        .sleeve img { width: 100%; height: 100%; object-fit: cover; }
        
        .vinyl-disc {
            position: absolute; top: 5px; right: -20px;
            width: 190px; height: 190px; background: radial-gradient(circle, #333 0%, #000 100%);
            border-radius: 50%; z-index: 1; transition: 0.5s ease;
        }
        .album-container:hover .vinyl-disc { right: -100px; transform: rotate(90deg); }

        /* Real 3D Globe */
        #globeViz { height: 500px; width: 100%; margin: 50px 0; }

        /* Mini Music Player */
        .music-widget {
            position: fixed; bottom: 20px; right: 20px;
            width: 300px; z-index: 1000; transition: 0.3s;
        }
        .widget-toggle {
            background: var(--hot-pink); color: white; width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; margin-left: auto; margin-bottom: 10px;
        }

        /* Modal / Pop-up for Album Info */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 40px; border-radius: 25px;
            max-width: 500px; width: 90%; text-align: left;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        .close-modal { float: right; cursor: pointer; font-size: 1.5rem; color: var(--hot-pink); }

        h2 { font-family: 'Playfair Display', serif; color: var(--hot-pink); }
    </style>
</head>
<body>

    <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> LIBRARY</a>

    <header>
        <h1>Visions & Eras</h1>
        <p style="letter-spacing: 3px; font-weight: 300;">THE DISCOGRAPHY OF TARUSHI NANDWANI</p>
    </header>

    <div class="vinyl-crate">
        <div class="album-container" onclick="openModal('anthology')">
            <div class="vinyl-disc"></div>
            <div class="sleeve"><img src="anthology_cover.jpg"></div>
            <h3>The Anthology</h3>
        </div>
        <div class="album-container" onclick="openModal('midnights')">
            <div class="vinyl-disc"></div>
            <div class="sleeve"><img src="midnights_cover.jpg"></div>
            <h3>Midnights</h3>
        </div>
        <div class="album-container" onclick="openModal('visions')">
            <div class="vinyl-disc"></div>
            <div class="sleeve"><img src="visions_cover.jpg"></div>
            <h3>Visions</h3>
        </div>
    </div>

    <section>
        <h2 style="font-size: 2.5rem;">World Tour</h2>
        <div id="globeViz"></div> </section>

    <div id="albumModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Album Name</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="music-widget" id="musicWidget">
        <div class="widget-toggle" onclick="toggleMusic()"><i class="fas fa-music"></i></div>
        <div id="playerFrame">
            <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/6sGIMrtIzQjdzNndVxe397?utm_source=generator" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        // 1. DATA FOR MODALS
        const albumData = {
            anthology: "<h2>Tracklist - Year 1</h2><ul><li>Foundation in Data Science</li><li>Moving to Sydney Era</li><li>TEDx Vice Chairperson Legacy</li></ul>",
            midnights: "<h2>Tracklist - Year 2</h2><ul><li>AISOC Presidency Era</li><li>Lead AICON Flagship</li><li>Data Decision Architect</li></ul>",
            visions: "<h2>Tracklist - Final Year</h2><ul><li>UNSW Founders Ambassador</li><li>Secretary of WIM & Indian Society</li><li>Final Research Projects</li></ul>"
        };

        function openModal(id) {
            document.getElementById('modalBody').innerHTML = albumData[id];
            document.getElementById('albumModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('albumModal').style.display = 'none'; }

        // 2. TOGGLE MUSIC
        function toggleMusic() {
            const frame = document.getElementById('playerFrame');
            frame.style.display = frame.style.display === 'none' ? 'block' : 'none';
        }

        // 3. THE REAL 3D GLOBE
        const myData = [
            { lat: 20.5937, lng: 78.9629, name: 'India', size: 0.5 },
            { lat: 23.4241, lng: 53.8478, name: 'UAE', size: 0.5 },
            { lat: 22.3193, lng: 114.1694, name: 'Hong Kong', size: 0.5 },
            { lat: -33.8688, lng: 151.2093, name: 'Sydney', size: 0.5 }
        ];

        Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg') // Base map
            .backgroundColor('rgba(0,0,0,0)') // Transparent
            .pointColor(() => '#d63384') // Pink sparkly points
            .pointsData(myData)
            .pointAltitude('size')
            .pointRadius(0.3)
            .pointLabel('name')
            .onPointClick(d => window.alert(d.name))
            .showAtmosphere(true)
            .atmosphereColor('#ffb6c1')
            (document.getElementById('globeViz'));
    </script>

</body>
</html>
