<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker | Tarushi Nandwani</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfcfc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .todo-container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { font-weight: 600; color: #1a1a1a; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #0070f3; }
        button#add-btn { background: #0070f3; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        ul { list-style: none; padding: 0; }
        li { background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .delete-btn { color: #ff4d4d; border: none; background: none; cursor: pointer; font-size: 1.1rem; }
        .back-home { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="todo-container">
    <h2>Task Tracker</h2>
    <div class="input-group">
        <input type="text" id="task-input" placeholder="Add a new task...">
        <button id="add-btn">Add</button>
    </div>
    <ul id="task-list"></ul>
    <a href="index.html" class="back-home">← Back to Portfolio</a>
</div>

<script>
    const input = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');

    // Function to add a task
    function addTask() {
        const taskValue = input.value.trim();
        if (taskValue === "") return;

        const li = document.createElement('li');
        li.innerHTML = `
            <span>${taskValue}</span>
            <button class="delete-btn"><i class="fa-solid fa-trash"></i></button>
        `;

        // Delete functionality
        li.querySelector('.delete-btn').addEventListener('click', () => {
            li.remove();
        });

        taskList.appendChild(li);
        input.value = ""; // Clear input
    }

    addBtn.addEventListener('click', addTask);

    // Allow pressing "Enter" to add
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTask();
    });
</script>

</body>
</html>
