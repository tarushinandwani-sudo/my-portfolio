<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Productivity Hub | Tarushi Nandwani</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #0070f3; --delete: #ff4d4d; }
        body { font-family: 'Inter', sans-serif; background: #fcfcfc; color: #1a1a1a; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .todo-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        
        h2 { font-weight: 600; margin-bottom: 5px; text-align: center; }
        .subtitle { font-size: 0.85rem; color: #666; text-align: center; margin-bottom: 25px; display: block; }

        /* Input Styles */
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); }
        select { padding: 12px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; }
        button#add-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }

        /* Filter Tabs */
        .filters { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { background: #f0f0f0; border: none; padding: 6px 12px; border-radius: 15px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .filter-btn:hover { background: #e0e0e0; }

        /* List Styles */
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; transition: 0.2s; cursor: pointer; }
        li:hover { border-color: #ddd; }
        .task-content { display: flex; align-items: center; gap: 10px; }
        .tag { font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        
        /* Category Colors */
        .tag-Internships { background: #eef6ff; color: #0070f3; }
        .tag-Work { background: #ebfbee; color: #2b8a3e; }
        .tag-University { background: #fff4e5; color: #ff922b; }
        .tag-Societies { background: #f3f0ff; color: #845ef7; }

        .delete-btn { color: #ccc; border: none; background: none; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .delete-btn:hover { color: var(--delete); }

        #counter { font-size: 0.75rem; color: #999; margin-top: 15px; text-align: center; }
        #clear-completed { background: none; border: 1px solid var(--delete); color: var(--delete); padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.7rem; margin-top: 10px; }
        .back-home { display: block; text-align: center; margin-top: 25px; text-decoration: none; color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="todo-container">
    <h2>Task Tracker</h2>
    <span class="subtitle">Managing Labs, Leadership & Career</span>

    <div class="input-group">
        <input type="text" id="task-input" placeholder="What needs to be done?">
        <div class="row">
            <select id="category-select">
                <option value="University">University</option>
                <option value="Internships">Internships</option>
                <option value="Work">Part-time Work</option>
                <option value="Societies">Societies</option>
            </select>
            <button id="add-btn">Add Task</button>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn" onclick="filterTasks('All')">All</button>
        <button class="filter-btn" onclick="filterTasks('University')">Uni</button>
        <button class="filter-btn" onclick="filterTasks('Internships')">Interns</button>
        <button class="filter-btn" onclick="filterTasks('Work')">Work</button>
        <button class="filter-btn" onclick="filterTasks('Societies')">Soc</button>
    </div>

    <ul id="task-list"></ul>

    <div style="text-align: center;">
        <p id="counter">Tasks: 0</p>
        <button id="clear-completed"><i class="fa-solid fa-broom"></i> Clear Finished</button>
    </div>

    <a href="index.html" class="back-home">← Back to Portfolio</a>
</div>

<script>
    const input = document.getElementById('task-input');
    const categorySelect = document.getElementById('category-select');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');
    const clearBtn = document.getElementById('clear-completed');

    // Load tasks from LocalStorage
    let tasks = JSON.parse(localStorage.getItem('tarushiTasks')) || [];
    
    function init() {
        renderAll();
    }

    function renderAll(filteredTasks = tasks) {
        taskList.innerHTML = '';
        filteredTasks.forEach((task, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="task-content">
                    <span class="tag tag-${task.category}">${task.category}</span>
                    <span style="text-decoration: ${task.completed ? 'line-through' : 'none'}; opacity: ${task.completed ? '0.5' : '1'}">${task.text}</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(event, ${index})"><i class="fa-solid fa-trash"></i></button>
            `;
            li.onclick = () => toggleTask(index);
            taskList.appendChild(li);
        });
        updateCounter();
    }

    function addTask() {
        const text = input.value.trim();
        const category = categorySelect.value;
        if (text === "") return;

        tasks.push({ text, category, completed: false });
        saveAndRender();
        input.value = "";
    }

    function toggleTask(index) {
        tasks[index].completed = !tasks[index].completed;
        saveAndRender();
    }

    function deleteTask(event, index) {
        event.stopPropagation(); // Prevents toggleTask from firing
        tasks.splice(index, 1);
        saveAndRender();
    }

    function filterTasks(category) {
        if (category === 'All') {
            renderAll();
        } else {
            const filtered = tasks.filter(t => t.category === category);
            renderAll(filtered);
        }
    }

    clearBtn.onclick = () => {
        tasks = tasks.filter(t => !t.completed);
        saveAndRender();
    };

    function saveAndRender() {
        localStorage.setItem('tarushiTasks', JSON.stringify(tasks));
        renderAll();
    }

    function updateCounter() {
        const active = tasks.filter(t => !t.completed).length;
        document.getElementById('counter').innerText = `${active} active tasks remaining`;
    }

    addBtn.onclick = addTask;
    input.onkeypress = (e) => { if (e.key === 'Enter') addTask(); };

    init();
</script>

</body>
</html>
